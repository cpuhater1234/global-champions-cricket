name: GCC v7.2.9 Finals QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  finals-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.9 candidate
        run: python qa/rebuild_v729.py

      - name: Run Finals hierarchy guardrail
        run: python qa/check_v729_finals.py

      - name: Check postseason journey syntax
        run: node --check qa/browser_v729_postseason_journey.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run Finals and Season Review journey
        run: node --experimental-websocket qa/browser_v729_postseason_journey.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v729-finals-qa
          path: |
            qa/output/v729-postseason-journey/
            game/global_champions_cricket_v7_2_9_finals_hierarchy.html
          if-no-files-found: warn
