name: GCC v7.2.5 Draw QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  draw-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.5 candidate
        run: python qa/rebuild_v725.py

      - name: Run draw-transition structural guardrail
        run: python qa/check_v725_draw.py

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run Draft Order Draw regression
        run: node --experimental-websocket qa/browser_v725_draft_draw.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v725-draw-qa
          path: |
            qa/output/v725-draw-audit/
            game/global_champions_cricket_v7_2_5_draw_transition_hardening.html
          if-no-files-found: warn
