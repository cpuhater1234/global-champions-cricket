name: GCC v7.2.13 Year Transition Audit

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  year-transition-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.13 candidate
        run: python qa/rebuild_v7213.py

      - name: Run v7.2.13 mid-season guardrail
        run: python qa/check_v7213_midseason.py

      - name: Check year-transition audit syntax
        run: node --check qa/browser_v7213_year_transition_audit.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run 2009 to 2010 continuity audit
        run: node --experimental-websocket qa/browser_v7213_year_transition_audit.mjs

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v7213-year-transition-audit
          path: |
            qa/output/v7213-year-transition-audit/
            game/global_champions_cricket_v7_2_13_midseason_trade_window.html
          if-no-files-found: warn
