name: GCC league leaders inspection
on:
  push:
    branches: [work/v116-candidate-acceptance]
    paths: ['.github/workflows/v116-league-leaders.yml', 'qa/v116_league_leaders_native.cjs']
permissions:
  contents: read
env:
  CANDIDATE_SHA256: 4b68961147690e175921c9cbe3b84195244e0495bd161742531e3780b90d8c05
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact candidate and base
        run: |
          mkdir -p /tmp/trade-before
          git archive 6626dcb488941942c78f4bcc6c3c608ea934fc3b v116/canonical | tar -x -C /tmp/trade-before
          python qa/v116_canonical_source.py build --source /tmp/trade-before/v116/canonical --allow-runtime-changes --output qa/results/trade-before.html
          python qa/v116_canonical_source.py build --source v116/canonical --allow-runtime-changes --output qa/results/trade-candidate.html --report qa/results/trade-gate-build.json
          python qa/v116_swap_choices_guard.py --before qa/results/trade-before.html --after qa/results/trade-candidate.html
          python qa/v116_engine_integrity.py --source v116/canonical --html qa/results/trade-candidate.html --self-test --report qa/results/trade-gate-pins.json
      - uses: actions/cache/restore@v4
        with:
          path: qa/results/whole-ui-career
          key: gcc-ui-career-79a2fbfe-seed101-v1-${{ hashFiles('qa/structural-risk/career-run.mjs', 'qa/offline_game_host.mjs') }}
          restore-keys: gcc-ui-career-79a2fbfe-seed101-v1-
      - name: Generate genuine injury fixture from baseline
        env:
          GCC8_TEST_BUILD: qa/results/trade-before.html
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
          GCC8_COVER_FIXTURE: qa/results/cover-fixture.json
        run: node qa/v116_injury_cover_fixture.mjs > qa/results/cover-fixture-provenance.json
      - name: Install native browser
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check native review, keyboard and accepted result
        env:
          GCC8_TEST_BUILD: qa/results/trade-candidate.html
          GCC8_BASELINE_BUILD: qa/results/trade-before.html
          GCC8_COVER_FIXTURE: qa/results/cover-fixture.json
        run: node qa/v116_league_leaders_native.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-leaders
          path: |
            qa/results/trade-gate-*.json
            qa/results/league-leaders-native
            qa/results/cover-fixture*.json
