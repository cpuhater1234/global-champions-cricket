name: GCC v7.2.10 Review QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  review-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.10 candidate
        run: python qa/rebuild_v7210.py

      - name: Run Season Review hierarchy guardrail
        run: python qa/check_v7210_review.py

      - name: Check review journey syntax
        run: node --check qa/browser_v7210_review_journey.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run full review journey
        run: node --experimental-websocket qa/browser_v7210_review_journey.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v7210-review-qa
          path: |
            qa/output/v7210-review-journey/
            game/global_champions_cricket_v7_2_10_review_hierarchy.html
          if-no-files-found: warn
