name: GCC guide section organisation review
on:
  push:
    branches: [work/v116-candidate-acceptance]
    paths: ['.github/workflows/v116-guide-sections.yml', 'qa/v116_guide_sections_native.cjs']
permissions:
  contents: write
env:
  # Exact six-background match-surface candidate.
  CANDIDATE_SHA256: 196515c5a170633c1e6abcca259798a5bb7bb7686cc4545124663651efc95f35
concurrency:
  group: gcc-guide-sections
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native browser
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock playwright
      - name: Build exact review candidate
        run: |
          python qa/v116_canonical_source.py build --source v116/canonical --allow-runtime-changes --output qa/results/interface-audit.html
          sha256sum qa/results/interface-audit.html
          mkdir -p /tmp/guide-before
          git archive 449735a2e01dbaef3b9cbc50d7ca1a7dd708fafd v116/canonical | tar -x -C /tmp/guide-before
          python qa/v116_canonical_source.py build --source /tmp/guide-before/v116/canonical --allow-runtime-changes --output qa/results/guide-before.html
      - name: Audit main screens, secondary panels and terminology
        env:
          GCC8_TEST_BUILD: qa/results/interface-audit.html
          GCC8_WHOLE_UI_DIR: qa/results/interface-audit
          GCC8_REQUIRE_OWNER_FIX: '1'
          GCC8_BASELINE_BUILD: qa/results/guide-before.html
          GCC8_ANALYSIS_DIR: qa/results/shared-analysis-native
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" node qa/v116_guide_sections_native.cjs
      - name: Preserve diagnostic evidence
        if: always()
        run: |
          python - <<'SAVE'
          from pathlib import Path
          from PIL import Image
          import shutil
          src=Path('qa/results/guide-sections-native');dst=Path('docs/release/guide-sections/${{ github.run_id }}');dst.mkdir(parents=True,exist_ok=True)
          for f in src.glob('*.json'):
              folder=dst if f.name=='manifest.json' else dst/(f.name[:4] if f.name[:4].isdigit() else 'foundation');folder.mkdir(parents=True,exist_ok=True);shutil.copyfile(f,folder/f.name)
          for f in src.glob('*.png'):
              folder=dst/(f.name[:4] if f.name[:4].isdigit() else 'foundation');folder.mkdir(parents=True,exist_ok=True);Image.open(f).convert('RGB').save(folder/f.with_suffix('.jpg').name,quality=88,optimize=True)
          SAVE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/release/guide-sections
          if ! git diff --cached --quiet; then
            git commit -m 'Record paired guide-section organisation evidence'
            git pull --rebase origin work/v116-candidate-acceptance
            git push origin HEAD:refs/heads/work/v116-candidate-acceptance
          fi
