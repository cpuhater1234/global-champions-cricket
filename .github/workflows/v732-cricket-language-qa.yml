name: GCC v7.3.2 Cricket Language QA

on:
  push:
    branches:
      - work/v7.3.2-cricket-language
  workflow_dispatch:

jobs:
  cricket-language:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.3.2 candidate
        run: python qa/rebuild_v732.py

      - name: Run v7.3.2 static and product guardrail
        run: python qa/check_v732.py

      - name: Restore browser harness
        run: cat qa/browser_v732_cricket_language.mjs.b64.part* | base64 -d > qa/browser_v732_cricket_language.mjs

      - name: Check browser harness syntax
        run: node --check qa/browser_v732_cricket_language.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run language and comprehension journey
        run: node --experimental-websocket qa/browser_v732_cricket_language.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v732-cricket-language-qa
          path: |
            qa/output/v732-cricket-language/
            game/global_champions_cricket_v7_3_2_cricket_language.html
          if-no-files-found: warn
