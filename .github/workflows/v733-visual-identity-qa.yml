name: GCC v7.3.3 Visual Identity QA

on:
  push:
    branches:
      - work/v7.3.3-visual-identity
  workflow_dispatch:

jobs:
  cricket-language:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4


      - name: Rebuild exact v7.3.3 candidate
        run: python qa/rebuild_v733.py

      - name: Run v7.3.3 static and product guardrail
        run: python qa/check_v733.py


      - name: Check browser harness syntax
        run: node --check qa/browser_v733_visual_identity.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run visual identity journey
        run: node --experimental-websocket qa/browser_v732_cricket_language.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v733-visual-identity-qa
          path: |
            qa/output/v733-visual-identity/
            game/global_champions_cricket_v7_3_3_visual_identity.html
          if-no-files-found: warn
