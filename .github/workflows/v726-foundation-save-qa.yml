name: GCC v7.2.6 Foundation Save QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  foundation-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.6 candidate
        run: python qa/rebuild_v726.py

      - name: Run foundation save-continuity guardrail
        run: python qa/check_v726_save.py

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run hard-reload foundation save regression
        run: node --experimental-websocket qa/browser_v726_foundation_save.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v726-foundation-save-qa
          path: |
            qa/output/v726-foundation-save/
            game/global_champions_cricket_v7_2_6_foundation_save_continuity.html
          if-no-files-found: warn
