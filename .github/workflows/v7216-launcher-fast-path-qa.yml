name: GCC v7.2.16 Launcher Fast Path QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  launcher-fast-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.16 candidate
        run: python qa/rebuild_v7216.py

      - name: Run launcher fast-path guardrail
        run: python qa/check_v7216_launcher.py

      - name: Check launcher browser harness syntax
        run: node --check qa/browser_v7216_launcher.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run launcher latency and full journey
        run: node --experimental-websocket qa/browser_v7216_launcher.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v7216-launcher-fast-path-qa
          path: |
            qa/output/v7216-launcher-audit/
            game/global_champions_cricket_v7_2_16_launcher_fast_path.html
          if-no-files-found: warn
