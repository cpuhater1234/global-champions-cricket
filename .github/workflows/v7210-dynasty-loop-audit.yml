name: GCC v7.2.10 Dynasty Loop Audit

on:
  workflow_dispatch:

jobs:
  dynasty-loop-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.10 candidate
        run: python qa/rebuild_v7210.py

      - name: Run v7.2.10 Review hierarchy guardrail
        run: python qa/check_v7210_review.py

      - name: Check dynasty-loop harness syntax
        run: node --check qa/browser_v7210_dynasty_loop_audit.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run 2009 offseason dynasty-loop audit
        run: node --experimental-websocket qa/browser_v7210_dynasty_loop_audit.mjs

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v7210-dynasty-loop-audit
          path: |
            qa/output/v7210-dynasty-loop-audit/
            game/global_champions_cricket_v7_2_10_review_hierarchy.html
          if-no-files-found: warn
