name: v117 draft archive and trade review
on:
  push:
    branches: [work/v117-final-surface-review]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GCC8_TEST_BUILD: PLAY_v117.html
      GCC8_TEST_REPORT_DIR: qa/results/surface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          echo 'a14e1f0c41bf383827b8f8e4e5c70b1c8ae1707c7744cc7935773eea10cecb85  PLAY_v117.html' | sha256sum -c
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          python - <<'PY'
          from pathlib import Path
          source = Path('qa/structural-risk/career-run.mjs').read_text().split('for(let year=2009;year<=lastYear;year++){',1)[0]
          marker = "coverage.reloads.push({year:s.year,label,source:'validated backup snapshot'});"
          assert source.count(marker)==1
          source = source.replace(marker, marker + "if(label==='foundation-user-pick')fs.writeFileSync(reportDir+'/draft.json',raw);")
          source += "fs.writeFileSync(reportDir+'/review.json',context.GCC8_ENGINE_READ.backupRaw());\n"
          Path('qa/structural-risk/surface-fixture.mjs').write_text(source)
          PY
          node qa/structural-risk/surface-fixture.mjs
      - name: Check responsive layout and modal keyboard flow
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict'),fs=require('node:fs');
          const {pathToFileURL}=require('node:url'),{resolve}=require('node:path');
          (async()=>{
            const browser=await chromium.launch();
            const errors=[],findings=[];
            try {
              for(const width of [320,390,1440]) for(const surface of ['draft','archive','trade']){
                const c=await browser.newContext({viewport:{width,height:900},reducedMotion:'reduce'});
                const save=fs.readFileSync('qa/results/surface/'+(surface==='draft'?'draft':'review')+'.json','utf8');
                await c.addInitScript(raw=>localStorage.setItem('gcc_dynasty_v8',raw),save);
                const p=await c.newPage();
                p.on('pageerror',e=>errors.push(e.message));
                await p.route(/^https?:/,route=>route.abort());
                await p.goto(pathToFileURL(resolve('PLAY_v117.html')).href);
                const call=async(action)=>assert(await p.evaluate(a=>GCC8.dispatch(a,[]),action),action);
                await call('continue');
                if(surface==='archive')await call('archive');
                if(surface==='trade')await call('offseason');
                assert.equal(await p.evaluate(()=>GCC8.ui.view),{draft:'draft',archive:'archive',trade:'dynasty'}[surface]);
                await p.evaluate(()=>document.fonts.ready);
                await p.screenshot({path:'qa/results/surface/'+surface+'-'+width+'.png'});
                const check=(ok,label)=>{if(!ok)findings.push([surface,width,label]);};
                check(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'document overflow');
                if(surface!=='draft'){
                  const selector=surface==='trade'?'[data-action=trade]':'[data-action=archiveSeason]';
                  const opener=p.locator(selector+':visible').first();
                  const args=await opener.getAttribute('data-args');
                  await opener.focus();
                  await p.keyboard.press('Enter');
                  const dialog=p.locator('#g8dialog[open]');
                  await dialog.waitFor();
                  await p.screenshot({path:'qa/results/surface/'+surface+'-dialog-'+width+'.png'});
                  check(await dialog.evaluate(e=>{const r=e.getBoundingClientRect();return r.left>=-1&&r.right<=innerWidth+1;}),'dialog viewport bounds');
                  for(const key of ['Tab','Tab','Shift+Tab']){
                    await p.keyboard.press(key);
                    check(await dialog.evaluate(e=>e.contains(document.activeElement)),key+' focus stays inside');
                  }
                  await p.keyboard.press('Escape');
                  check(await dialog.count()===0,'Escape closes dialog');
                  check(await p.evaluate(([action,args])=>document.activeElement.matches(action)&&document.activeElement.getAttribute('data-args')===args,[selector,args]),'focus returns to opener');
                }
                await c.close();
              }
              console.log(JSON.stringify({findings,errors}));
              assert.equal(errors.length,0);
              assert.equal(findings.length,0);
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v117-draft-archive-trade-screens
          path: qa/results/surface/*.png
