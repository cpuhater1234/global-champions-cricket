name: GCC final UI review
on:
  push:
    branches: [work/v116-candidate-acceptance]
    paths: ['qa/v116_finals_image_candidate.py', 'qa/v116_finals_image_audit.cjs', '.github/workflows/v116-final-ui-review.yml']
concurrency:
  group: gcc-final-ui-review
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock playwright
      - uses: actions/cache@v4
        with:
          path: qa/results/whole-ui-career
          key: gcc-ui-career-79a2fbfe-seed101-v1-${{ hashFiles('qa/structural-risk/career-run.mjs', 'qa/offline_game_host.mjs') }}
      - name: Compose pinned review build and actual career checkpoints
        env:
          GCC8_TEST_BUILD: qa/results/final-ui/baseline.html
          GCC8_TEST_REPORT_DIR: qa/results/whole-ui-career
          GCC8_TEST_SEED: '101'
          GCC8_TEST_LAST_YEAR: '2026'
          GCC8_TEST_SCOREBOOKS: '1'
        run: |
          python qa/v116_menu_surface_candidate.py --output qa/results/final-ui/baseline.html --report qa/results/final-ui/baseline.json
          python qa/v116_core_density_candidate.py --output qa/results/final-ui/density-baseline.html --report qa/results/final-ui/density.json
          python qa/v116_charcoal_surface_candidate.py --output qa/results/final-ui/palette-baseline.html --report qa/results/final-ui/palette.json
          python qa/v116_finals_image_candidate.py --output qa/results/final-ui/candidate.html --report qa/results/final-ui/build.json
          sha256sum qa/results/final-ui/candidate.html
          if [ ! -f qa/results/whole-ui-career/checkpoint-2026.json ]; then node qa/structural-risk/career-run.mjs; fi
      - name: Capture disposable native journeys
        id: capture
        continue-on-error: true
        env:
          GCC8_TEST_BUILD: qa/results/final-ui/candidate.html
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
          GCC8_WHOLE_UI_DIR: qa/results/final-ui-native
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" node qa/v116_whole_ui_capture.cjs
      - name: Compare control and guide parity after palette migration
        id: focus
        continue-on-error: true
        env:
          GCC8_BASELINE_BUILD: qa/results/final-ui/density-baseline.html
          GCC8_TEST_BUILD: qa/results/final-ui/candidate.html
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
          GCC8_CONTROL_DIR: qa/results/final-ui-focus
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" node qa/v116_shared_controls_audit.cjs
      - name: Verify actual Grand Final venue sizing
        id: venue
        continue-on-error: true
        env:
          GCC8_BASELINE_BUILD: qa/results/final-ui/palette-baseline.html
          GCC8_TEST_BUILD: qa/results/final-ui/candidate.html
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
          GCC8_IMAGE_DIR: qa/results/final-ui-venue
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" node qa/v116_finals_image_audit.cjs
      - name: Report isolated test coverage
        if: always()
        run: |
          python - <<'PYREPORT'
          import json
          from pathlib import Path
          p=Path('qa/results/final-ui-native/manifest.json')
          if p.exists():
              r=json.loads(p.read_text())
              print(json.dumps({'sha256':r['sha256'],'screenshots':len(r['screenshots']),'failures':r['failures'],'omissions':r['omissions'],'states':[{'name':s['name'],'viewport':s['viewport'],'horizontalOverflow':s['horizontalOverflow']} for s in r['screenshots']]},indent=2))
          PYREPORT
      - name: Save authorised disposable test screenshots
        if: always()
        run: |
          python - <<'PYSAVE'
          import json,shutil
          from pathlib import Path
          from PIL import Image
          src=Path('qa/results/final-ui-native'); dst=Path('docs/release/visual-review/final-ui')
          dst.mkdir(parents=True,exist_ok=True)
          if (src/'manifest.json').exists():
              shutil.copyfile(src/'manifest.json',dst/'manifest.json')
          focus=Path('qa/results/final-ui-focus')
          if (focus/'report.json').exists():shutil.copyfile(focus/'report.json',dst/'focus-report.json')
          venue=Path('qa/results/final-ui-venue')
          if (venue/'report.json').exists():shutil.copyfile(venue/'report.json',dst/'venue-report.json')
          for f in list(src.glob('*.png'))+list(focus.glob('*.png'))+list(venue.glob('*.png')):
              im=Image.open(f).convert('RGB')
              # Preserve actual pixels up to a bounded long-page height, with no resize.
              im.crop((0,0,im.width,min(im.height,8000))).save(dst/(f.stem+'.jpg'),quality=88,optimize=True)
          PYSAVE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/release/visual-review/final-ui
          if ! git diff --cached --quiet; then
            git commit -m 'QA: preserve authorised disposable career visual evidence'
            published=0
            for attempt in 1 2 3; do
              git pull --rebase origin work/v116-candidate-acceptance
              if git push origin HEAD:refs/heads/work/v116-candidate-acceptance; then published=1; break; fi
            done
            test "$published" = 1
          fi
      - name: Require capture outcome
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          FOCUS_OUTCOME: ${{ steps.focus.outcome }}
          VENUE_OUTCOME: ${{ steps.venue.outcome }}
        run: test "$CAPTURE_OUTCOME" = success && test "$FOCUS_OUTCOME" = success && test "$VENUE_OUTCOME" = success
