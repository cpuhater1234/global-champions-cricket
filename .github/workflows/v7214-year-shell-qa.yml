name: GCC v7.2.14 Year Shell QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  year-shell-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.14 candidate
        run: python qa/rebuild_v7214.py

      - name: Run year-shell continuity guardrail
        run: python qa/check_v7214_shell.py

      - name: Check year-transition regression syntax
        run: node --check qa/browser_v7214_year_transition_audit.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run 2009 to 2010 year-shell regression
        run: node --experimental-websocket qa/browser_v7214_year_transition_audit.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v7214-year-shell-qa
          path: |
            qa/output/v7214-year-transition-audit/
            game/global_champions_cricket_v7_2_14_year_shell_continuity.html
          if-no-files-found: warn
