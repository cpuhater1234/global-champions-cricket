name: GCC v7.5 Dynasty Memory QA

on:
  push:
    branches:
      - work/v7.5-dynasty-depth
    paths:
      - '.github/workflows/v750-dynasty-memory-qa.yml'
      - 'qa/rebuild_v750.py'
      - 'qa/check_v750.py'
      - 'qa/patches/v750_*.gz.b64'
      - 'qa/GCC_v750_dynasty_memory_plan.md'
  workflow_dispatch:

jobs:
  dynasty-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild v7.5 from accepted v7.4.1
        run: python qa/rebuild_v750.py

      - name: Verify v7.5 scope and syntax
        run: python qa/check_v750.py

      - name: Upload v7.5 candidate
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v750-dynasty-memory-candidate
          path: game/global_champions_cricket_v7_5_0_dynasty_memory.html
          if-no-files-found: error
