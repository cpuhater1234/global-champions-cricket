name: GCC canonical integrity and copy review
on:
  push:
    branches: [work/v116-candidate-acceptance]
    paths: ['.github/workflows/v116-integrity-copy.yml', 'qa/v116_integrity.mjs', 'qa/v116_engine_integrity.py', 'qa/v116_copy_native.cjs']
permissions:
  contents: read
env:
  CANDIDATE_SHA256: e58d2b82eb88f5e118b0c676365c9d1f9a9953c27b60c3643fc0d889400dc171
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed baseline and run integrity suite
        run: |
          mkdir -p /tmp/copy-before
          git archive 470665ab24dc1792190d860c00d4829d494319b8 v116/canonical | tar -x -C /tmp/copy-before
          python qa/v116_canonical_source.py build --source /tmp/copy-before/v116/canonical --allow-runtime-changes --output qa/results/copy-before.html
          node qa/v116_integrity.mjs --baseline qa/results/copy-before.html
      - name: Install native browser
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: qa/results/whole-ui-career
          key: gcc-ui-career-79a2fbfe-seed101-v1-${{ hashFiles('qa/structural-risk/career-run.mjs', 'qa/offline_game_host.mjs') }}
          restore-keys: gcc-ui-career-79a2fbfe-seed101-v1-
      - name: Check paired native copy and preserved actions
        env:
          GCC8_BASELINE_BUILD: qa/results/copy-before.html
          GCC8_TEST_BUILD: qa/results/v116-integrity/candidate.html
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
        run: |
          test -f qa/results/whole-ui-career/checkpoint-2009.json
          node qa/v116_copy_native.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-integrity-copy-review
          path: |
            qa/results/v116-integrity/*.json
            qa/results/v116-integrity/foundation/*.json
            qa/results/v116-integrity/fixtures/*.json
            qa/results/copy-consistency-native
