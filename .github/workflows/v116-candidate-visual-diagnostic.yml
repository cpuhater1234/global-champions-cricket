name: GCC v116 candidate finals overflow diagnostic

on:
  push:
    branches:
      - work/v116-candidate-acceptance
    paths:
      - 'qa/v116_finals_overflow_diagnostic.cjs'
      - 'qa/v116_finals_layout_candidate.py'
      - 'qa/v116_review_gallery.py'
      - '.github/workflows/v116-candidate-visual-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: gcc-v116-finals-overflow-diagnostic
  cancel-in-progress: true

jobs:
  finals-overflow:
    name: Inspect saved-career finals layout without changing game source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium and browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock playwright

      - name: Build exact isolated signing-width candidate
        run: |
          python qa/v116_signing_width_candidate.py \
            --output qa/results/v116-signing-width-review.html \
            --report qa/results/v116-signing-candidate-build.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('qa/results/v116-signing-candidate-build.json').read_text())
          assert r['status']=='CANDIDATE_ONLY' and r['playable_release_unchanged']
          assert r['candidate_sha256']=='a8aa0b653d2476b120353e3511e43e2b07d8f92e9a3b2ce9ff383313f7cf3ecb'
          assert r['candidate_bytes']==6635082
          print('PASS: exact candidate built; frozen v116 unchanged')
          PY

      - name: Generate deterministic saved-career checkpoints
        env:
          GCC8_TEST_BUILD: qa/results/v116-signing-width-review.html
          GCC8_TEST_REPORT_DIR: qa/results/v116-candidate-career
          GCC8_TEST_SEED: '101'
          GCC8_TEST_LAST_YEAR: '2019'
          GCC8_TEST_SCOREBOOKS: '1'
        run: node qa/structural-risk/career-run.mjs

      - name: Validate diagnostic script
        run: node --check qa/v116_finals_overflow_diagnostic.cjs

      - name: Inspect finals DOM at desktop, tablet and mobile widths
        env:
          GCC8_TEST_BUILD: qa/results/v116-signing-width-review.html
          GCC8_BROWSER_CAREER_DIR: qa/results/v116-candidate-career
          GCC8_DIAGNOSTIC_DIR: qa/results/v116-finals-diagnostic
          GCC8_DIAGNOSTIC_YEARS: '2019'
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" \
            node qa/v116_finals_overflow_diagnostic.cjs

      - name: Syntax-check local visual gallery builder
        run: python -m py_compile qa/v116_review_gallery.py qa/v116_finals_layout_candidate.py

      - name: Render and verify local screenshot gallery from 2019 saved career
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" \
            python qa/v116_review_gallery.py \
              --checkpoint-dir qa/results/v116-candidate-career \
              --years 2019 \
              --widths 320,390,1440 \
              --output qa/results/v116-gallery-proof \
              --no-open
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('qa/results/v116-gallery-proof/gallery.json').read_text())
          assert data['status']=='VISUAL_REVIEW_READY',data
          assert data['candidate_sha256']=='5ba82e499b0b8d08706aab851449d20b6d315bf9b780a8c9674b44933d3fe094'
          assert data['states']==27, data
          assert data['geometry_issues']==[] and data['browser_errors']==[], data
          assert Path(data['index']).is_file()
          screenshots=list(Path('qa/results/v116-gallery-proof/screenshots').glob('*.png'))
          assert len(screenshots)==27,len(screenshots)
          print('PASS: local review gallery generated 27 native Chromium PNGs and one clickable HTML index, with no artifact upload')
          PY

      - name: Summarize diagnostics without artifacts
        if: always()
        run: |
          if [ -f qa/results/v116-finals-diagnostic/report.json ]; then
            node - <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('qa/results/v116-finals-diagnostic/report.json','utf8'));
          const issue=d.states.filter(s=>s.baseline.overflow).length;
          const after=d.states.filter(s=>s.experiment.overflow).length;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Finals diagnostic (no artifact storage)\n\n'+
            '- Baseline overflow states: '+issue+'\n'+
            '- Browser-only stretch experiment overflow states: '+after+'\n'+
            '- Release files modified: no\n');
          JS
          fi
