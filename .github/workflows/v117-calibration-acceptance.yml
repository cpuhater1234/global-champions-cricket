name: v117 calibration acceptance
on:
  push:
    branches: [work/v117-late-wicket-calibration]
    paths: ['.github/workflows/v117-calibration-acceptance.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [career, native-save]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild the calibration candidate
        run: |
          mkdir -p qa/results
          node qa/scratch_build_final.mjs
          echo 'e21c54c8596ab12e7f5a42daee96e88aabea779ece49f2871cebada722c87d2a  qa/candidates/v116-authenticity-candidate.html' | sha256sum -c
      - name: Run all 19 seasons
        if: matrix.check == 'career'
        env:
          GCC8_TEST_BUILD: qa/candidates/v116-authenticity-candidate.html
          GCC8_TEST_REPORT_DIR: qa/results/calibration-career
          GCC8_TEST_LAST_YEAR: '2026'
        run: node qa/structural-risk/career-run.mjs
      - uses: actions/setup-python@v5
        if: matrix.check == 'native-save'
        with:
          python-version: '3.11'
      - name: Verify Chromium save and Continue Career
        if: matrix.check == 'native-save'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python captaincy_layer_v116.py --html qa/candidates/v116-authenticity-candidate.html --no-hash-check --mode http --case-timeout 240 --out-dir qa/results/calibration-native
