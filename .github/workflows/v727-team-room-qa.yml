name: GCC v7.2.7 Team Room QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  team-room-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.7 candidate
        run: python qa/rebuild_v727.py

      - name: Run Team Room transition guardrail
        run: python qa/check_v727_transition.py

      - name: Check journey harness syntax
        run: node --check qa/browser_v727_preseason_journey.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run full v7.2.7 preseason journey
        run: node --experimental-websocket qa/browser_v727_preseason_journey.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v727-team-room-qa
          path: |
            qa/output/v727-preseason-journey/
            game/global_champions_cricket_v7_2_7_team_room_transition.html
          if-no-files-found: warn
