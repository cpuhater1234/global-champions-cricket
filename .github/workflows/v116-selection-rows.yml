name: GCC selection rows review
on:
  push:
    branches: [work/v116-candidate-acceptance]
    paths: ['.github/workflows/v116-selection-rows.yml', 'qa/v116_selection_rows_native.cjs']
permissions:
  contents: read
env:
  # Exact selection-row CSS-only candidate.
  CANDIDATE_SHA256: 76abca374125bf6b55464905f91983a2ba24563b420f064a000a48c858c0e0c9
concurrency:
  group: gcc-selection-rows
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native browser
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock playwright
      - name: Build exact review candidate
        run: |
          python qa/v116_canonical_source.py build --source v116/canonical --allow-runtime-changes --output qa/results/interface-audit.html
          sha256sum qa/results/interface-audit.html
          mkdir -p /tmp/guide-before
          git archive d8590fa92168dae5bdd31f6f0a4f0e2829a2e878 v116/canonical | tar -x -C /tmp/guide-before
          python qa/v116_canonical_source.py build --source /tmp/guide-before/v116/canonical --allow-runtime-changes --output qa/results/guide-before.html
      - uses: actions/cache/restore@v4
        with:
          path: qa/results/whole-ui-career
          key: gcc-ui-career-79a2fbfe-seed101-v1-${{ hashFiles('qa/structural-risk/career-run.mjs', 'qa/offline_game_host.mjs') }}
      - name: Require existing checkpoints
        run: |
          test -f qa/results/whole-ui-career/checkpoint-2009.json
          test -f qa/results/whole-ui-career/checkpoint-2019.json
          test -f qa/results/whole-ui-career/checkpoint-2025.json
          test -f qa/results/whole-ui-career/checkpoint-2026.json
      - name: Check paired XI and bench layouts
        env:
          GCC8_TEST_BUILD: qa/results/interface-audit.html
          GCC8_WHOLE_UI_DIR: qa/results/interface-audit
          GCC8_REQUIRE_OWNER_FIX: '1'
          GCC8_BASELINE_BUILD: qa/results/guide-before.html
          GCC8_ANALYSIS_DIR: qa/results/shared-analysis-native
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" node qa/v116_selection_rows_native.cjs
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-rows-native
          path: qa/results/selection-rows-native
