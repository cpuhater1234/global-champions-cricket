name: Publish verified Season Book build
on:
  push:
    branches: [work/v117-final-surface-review]
    paths: ['.github/workflows/v117-publish-season-book.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          mkdir -p qa/results
          node qa/scratch_build_final.mjs
          cp qa/candidates/v116-authenticity-candidate.html PLAY_v117.html
          hash=bbc5c7bf96edc70d62a1ddd33f48e1a5bf01cebbdf0b1f413d7992d26ac4c693
          printf '%s  %s\n' "$hash" PLAY_v117.html "$hash" qa/candidates/v116-authenticity-candidate.html | sha256sum -c
          test "$(tr 'A-F' 'a-f' < qa/candidates/CANDIDATE_SHA256.txt)" = "$hash"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAY_v117.html qa/candidates/v116-authenticity-candidate.html qa/candidates/CANDIDATE_SHA256.txt
          git commit -m 'Publish verified Season Book build'
          git push origin HEAD:refs/heads/work/v117-final-surface-review
