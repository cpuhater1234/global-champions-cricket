name: GCC v116 native browser acceptance

on:
  push:
    branches: [v116]
    paths:
      - 'GCC_v116_release (1).html'
      - 'captaincy_layer_v116.py'
      - 'qa/native_two_tab_v116.py'
      - 'qa/native_v116_signing_css.py'
      - 'qa/v116_signing_width_candidate.py'
      - '.github/workflows/v116-native-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcc-v116-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  captaincy-save-continue:
    name: Captaincy, save, reload and Continue
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Document original v116 signing-day mobile overflow
        run: |
          python qa/native_v116_signing_css.py \
            --html 'GCC_v116_release (1).html' \
            --expect-known-overflow \
            --out qa/results/v116-signing-original.json
      - name: Build one-declaration experimental signing review candidate
        run: |
          python qa/v116_signing_width_candidate.py \
            --output qa/results/v116-signing-width-review.html \
            --report qa/results/v116-signing-candidate-build.json
      - name: Native phone and desktop candidate signing check
        run: |
          python qa/native_v116_signing_css.py \
            --html qa/results/v116-signing-width-review.html \
            --experimental-candidate \
            --out qa/results/v116-signing-candidate-native.json
      - name: Verify observed original defect and corrected candidate separately
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          original=json.loads(Path('qa/results/v116-signing-original.json').read_text())
          build=json.loads(Path('qa/results/v116-signing-candidate-build.json').read_text())
          candidate=json.loads(Path('qa/results/v116-signing-candidate-native.json').read_text())
          assert original['status']=='KNOWN_OVERFLOW' and not original['candidate']
          assert original['known_overflows'][0]['viewport']==390
          assert original['known_overflows'][0]['document_scroll_width']>390
          assert build['status']=='CANDIDATE_ONLY' and build['playable_release_unchanged']
          assert candidate['status']=='PASS' and candidate['candidate']
          assert candidate['sha256']==build['candidate_sha256']!=original['sha256']
          assert candidate['widths']==[390,1440]
          assert not candidate['known_overflows']
          assert all(not r['page_errors'] for r in candidate['snapshots'])
          msg='KNOWN DEFECT: frozen v116 signing day strip exceeds 390px viewport. EXPERIMENT PASS: one-declaration review candidate fits both 390px/1440px without JS errors. Not promoted.'
          print(msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Signing-week visual defect and review candidate\n\n'+msg+'\n')
          PY
      - name: Verify exact v116 release through native browser storage
        run: |
          python captaincy_layer_v116.py \
            --html 'GCC_v116_release (1).html' \
            --mode http \
            --case-timeout 240 \
            --out-dir qa/results/v116-native
      # Repository artifact storage is at quota. Keep test results in job logs
      # and a short GitHub Actions summary without uploading an artifact.
      - name: Verify and summarize native result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('qa/results/v116-native/captaincy_result.json').read_text())
          assert report['status'] == 'PASS'
          assert report['mode'] == 'http' and report['native_storage_checked']
          assert len(report['runs']) == 2
          assert all(run['reloaded']['captaincy'] == run['plan'] for run in report['runs'])
          message = 'PASS: 2/2 native Chromium save, reload and Continue scenarios'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## GCC v116 native acceptance\n\n' + message + '\n')
          PY
      - name: Verify two-tab stale-save protection and recovery
        run: |
          python qa/native_two_tab_v116.py \
            --html 'GCC_v116_release (1).html' \
            --out qa/results/v116-native-two-tab.json
      - name: Summarize two-tab acceptance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('qa/results/v116-native-two-tab.json').read_text())
          assert r['status']=='PASS' and r['native_origin']
          assert r['stale_save_rejected'] and r['indexeddb_preserved']
          assert r['reloaded_latest'] and r['rounds']==[1,2]
          line='PASS: native two-tab stale-save rejected, IndexedDB preserved, Continue restored latest Round 2'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n## GCC v116 two-tab acceptance\n\n'+line+'\n')
          PY

