name: GCC v116 native browser acceptance

on:
  push:
    branches: [v116]
    paths:
      - 'GCC_v116_release (1).html'
      - 'captaincy_layer_v116.py'
      - '.github/workflows/v116-native-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcc-v116-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  captaincy-save-continue:
    name: Captaincy, save, reload and Continue
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify exact v116 release through native browser storage
        run: |
          python captaincy_layer_v116.py \
            --html 'GCC_v116_release (1).html' \
            --mode http \
            --case-timeout 240 \
            --out-dir qa/results/v116-native
      # Repository artifact storage is at quota. Keep test results in job logs
      # and a short GitHub Actions summary without uploading an artifact.
      - name: Verify and summarize native result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('qa/results/v116-native/captaincy_result.json').read_text())
          assert report['status'] == 'PASS'
          assert report['mode'] == 'http' and report['native_storage_checked']
          assert len(report['runs']) == 2
          assert all(run['reloaded']['captaincy'] == run['plan'] for run in report['runs'])
          message = 'PASS: 2/2 native Chromium save, reload and Continue scenarios'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## GCC v116 native acceptance\n\n' + message + '\n')
          PY
