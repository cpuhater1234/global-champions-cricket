name: GCC v7.3.0 Core Game Experience QA

on:
  push:
    branches:
      - work/v7.3-game-experience
  workflow_dispatch:

jobs:
  core-game-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.3.0 candidate
        run: python qa/rebuild_v730.py

      - name: Run v7.3.0 static/product guardrail
        run: python qa/check_v730.py

      - name: Check browser harness syntax
        run: node --check qa/browser_v730_core_game_experience.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run XI ownership and interruption journey
        run: node --experimental-websocket qa/browser_v730_core_game_experience.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v730-core-game-experience-qa
          path: |
            qa/output/v730-core-game-experience/
            game/global_champions_cricket_v7_3_0_core_game_experience.html
          if-no-files-found: warn
