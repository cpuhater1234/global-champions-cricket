name: GCC v116 Claude menu candidate full acceptance

on:
  push:
    branches:
      - work/v116-candidate-acceptance
    paths:
      - 'qa/native_v116_signing_css.py'
      - 'qa/native_two_tab_v116.py'
      - 'qa/v116_signing_width_candidate.py'
      - 'qa/v116_finals_layout_candidate.py'
      - 'qa/v116_menu_review_candidate.py'
      - 'qa/v116_menu_visual_audit.cjs'
      - 'v8/ui/decision-ui.css'
      - 'qa/v116_source_reconciliation.py'
      - 'qa/structural-risk/career-run.mjs'
      - 'qa/offline_game_host.mjs'
      - 'qa/v8_browser_career_audit.cjs'
      - 'captaincy_layer_v116.py'
      - '.github/workflows/v116-candidate-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: gcc-v116-candidate-acceptance
  cancel-in-progress: true

jobs:
  candidate-acceptance:
    name: Claude menu candidate, 19 seasons, native persistence and visual QA
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native Chromium and test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock playwright

      - name: Build checksum-pinned Claude menu candidate
        run: |
          python qa/v116_menu_review_candidate.py \
            --output qa/results/v116-menu-review/GCC_v116_menu_review.html \
            --report qa/results/v116-menu-review/build.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path('qa/results/v116-menu-review/build.json').read_text())
          assert r['status']=='MENU_REVIEW_CANDIDATE_ONLY' and r['playable_release_unchanged']
          assert r['base_accepted_candidate_sha256']=='5ba82e499b0b8d08706aab851449d20b6d315bf9b780a8c9674b44933d3fe094'
          assert r['candidate_sha256']=='943643a36730f9db6630437b15111b5f82041b540998f793230aab1745be21e3'
          assert r['candidate_bytes']==6641178
          assert r['existing_style_blocks_changed']==1 and r['new_style_blocks']==0
          assert r['javascript_blocks_changed']==0
          assert hashlib.sha256(Path('qa/results/v116-menu-review/GCC_v116_menu_review.html').read_bytes()).hexdigest()==r['candidate_sha256']
          print('PASS: exact Claude menu candidate built; SHA-256',r['candidate_sha256'])
          print('PASS: only one existing CSS block changed; frozen v116 and main remain untouched')
          PY

      - name: Check signing strip at five responsive widths
        run: |
          python qa/native_v116_signing_css.py \
            --html qa/results/v116-menu-review/GCC_v116_menu_review.html \
            --menu-candidate \
            --widths 320,360,390,768,1440 \
            --out qa/results/v116-signing-candidate-responsive.json

      - name: Verify responsive signing measurements
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('qa/results/v116-signing-candidate-responsive.json').read_text())
          assert r['status']=='PASS' and r['candidate']
          assert r['sha256']==json.loads(Path('qa/results/v116-menu-review/build.json').read_text())['candidate_sha256']
          assert r['widths']==[320,360,390,768,1440]
          assert len(r['snapshots'])==5 and not r['known_overflows']
          for row in r['snapshots']:
              assert row['days_visible']==5, row
              assert row['document_scroll_width']<=row['viewport']['width']+1, row
              assert not row['page_errors'], row
          line='PASS: all five signing days fit at 320/360/390/768/1440px with no page errors or horizontal overflow'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Candidate signing responsive checks\n\n'+line+'\n')
          PY

      - name: Validate full-career harness syntax
        run: node --check qa/structural-risk/career-run.mjs

      - name: Run full 19-season cricket-engine acceptance on candidate
        env:
          GCC8_TEST_BUILD: qa/results/v116-menu-review/GCC_v116_menu_review.html
          GCC8_TEST_REPORT_DIR: qa/results/v116-candidate-career
          GCC8_TEST_SEED: '101'
          GCC8_TEST_LAST_YEAR: '2026'
          GCC8_TEST_SCOREBOOKS: '1'
        run: node qa/structural-risk/career-run.mjs

      - name: Verify full-career gameplay results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('qa/results/v116-candidate-career/v8_game_results.json').read_text())
          assert r['seasons']==19, r
          assert r['regularSeasonMatches']>=266, r
          assert r['errors']==[], r['errors']
          assert r['checks']>0 and r['coverage']['reloads'], r
          line=f"PASS: {r['seasons']} seasons, {r['regularSeasonMatches']} user regular-season matches, {r['checks']} assertions, no runtime errors"
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n## Candidate 19-season gameplay\n\n'+line+'\n')
          PY

      - name: Run native candidate gameplay, save, reload and Continue
        run: |
          python captaincy_layer_v116.py \
            --html qa/results/v116-menu-review/GCC_v116_menu_review.html \
            --no-hash-check --mode http --case-timeout 240 \
            --out-dir qa/results/v116-candidate-native-390

      - name: Verify native candidate gameplay and persistence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('qa/results/v116-candidate-native-390/captaincy_result.json').read_text())
          assert r['status']=='PASS' and r['mode']=='http' and r['native_storage_checked']
          assert r['sha256']==json.loads(Path('qa/results/v116-menu-review/build.json').read_text())['candidate_sha256']
          assert len(r['runs'])==2
          assert all(x['reloaded']['captaincy']==x['plan'] for x in r['runs'])
          line='PASS: exact candidate completed 2/2 independent native Chromium gameplay, save, reload and Continue scenarios at 390px'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n## Candidate native gameplay and persistence\n\n'+line+'\n')
          PY

      - name: Run full new-career gameplay journey at 320, 360 and 768px
        run: |
          set +e
          failed=0
          for width in 320 360 768; do
            python captaincy_layer_v116.py \
              --html qa/results/v116-menu-review/GCC_v116_menu_review.html \
              --no-hash-check --mode http --width "$width" --case 0 \
              --case-timeout 240 --out-dir "qa/results/v116-candidate-journey-$width"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "FAIL: candidate gameplay journey at ${width}px (exit ${status})"
              failed=1
            else
              echo "PASS: candidate gameplay journey at ${width}px"
            fi
          done
          exit "$failed"

      - name: Verify candidate responsive gameplay journeys
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected=json.loads(Path('qa/results/v116-menu-review/build.json').read_text())['candidate_sha256']
          for width in (320,360,768):
              r=json.loads(Path(f'qa/results/v116-candidate-journey-{width}/captaincy_result.json').read_text())
              assert r['status']=='PASS' and r['sha256']==expected and r['native_storage_checked']
              assert len(r['runs'])==1
              run=r['runs'][0]
              assert run['metrics']['innerWidth']==width
              assert run['metrics']['scrollWidth']<=width
              assert run['reloaded']['captaincy']==run['plan']
          line='PASS: full career-to-match journey, native save/reload and no captaincy-board overflow at 320/360/768px'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n## Candidate responsive gameplay journeys\n\n'+line+'\n')
          PY

      - name: Verify candidate two-tab stale-save protection and recovery
        run: |
          python qa/native_two_tab_v116.py \
            --html qa/results/v116-menu-review/GCC_v116_menu_review.html \
            --menu-candidate \
            --out qa/results/v116-candidate-two-tab.json

      - name: Summarize candidate two-tab recovery
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('qa/results/v116-candidate-two-tab.json').read_text())
          assert r['status']=='PASS' and r['native_origin'] and r['candidate']
          assert r['sha256']==json.loads(Path('qa/results/v116-menu-review/build.json').read_text())['candidate_sha256']
          assert r['stale_save_rejected'] and r['indexeddb_preserved'] and r['reloaded_latest']
          assert r['career_identity_preserved'] and r['post_continue_checkpoint_consistent']
          line='PASS: candidate rejected stale-tab writes, preserved IndexedDB and restored latest Round 2 career'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n## Candidate two-tab persistence\n\n'+line+'\n')
          PY

      - name: Render saved-career screens at responsive widths
        env:
          GCC8_TEST_BUILD: qa/results/v116-menu-review/GCC_v116_menu_review.html
          GCC8_BROWSER_CAREER_DIR: qa/results/v116-candidate-career
          GCC8_BROWSER_REPORT_DIR: qa/results/v116-candidate-visual
          GCC8_BROWSER_YEARS: '2019,2025,2026'
          GCC8_BROWSER_WIDTHS: '1440,1024,768,390,360,320'
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" \
            node qa/v8_browser_career_audit.cjs

      - name: Run native Chromium menu guide acceptance
        env:
          GCC8_TEST_BUILD: qa/results/v116-menu-review/GCC_v116_menu_review.html
          GCC8_MENU_SCREENSHOT_DIR: qa/results/v116-menu-review/screenshots
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" \
            node qa/v116_menu_visual_audit.cjs

      - name: Verify Claude menu layout and candidate identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          build=json.loads(Path('qa/results/v116-menu-review/build.json').read_text())
          r=json.loads(Path('qa/results/v116-menu-review/screenshots/report.json').read_text())
          assert r['candidate_sha256']==build['candidate_sha256']
          assert r['states']==18 and r['errors']==[] and r['failures']==[],r
          assert build['candidate_sha256']=='943643a36730f9db6630437b15111b5f82041b540998f793230aab1745be21e3'
          line='PASS: all three guide pages, all three expanded rule groups and 18 desktop/mobile/tablet states; no page errors or layout failures'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\\n## Claude menu responsive acceptance\\n\\n'+line+'\\n')
          PY

      - name: Verify saved-career responsive rendering
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('qa/results/v116-candidate-visual/report.json').read_text())
          widths={x['width'] for x in r['states']}
          assert {320,360,768}.issubset(widths), sorted(widths)
          assert not r['errors'], r['errors']
          issues=[x for x in r['states'] if x['overflow'] or x['clipped']]
          assert not issues, json.dumps(issues[:12],indent=2)
          line=f"PASS: {len(r['states'])} saved-career screen/viewport states at {sorted(widths)}px; no page errors, horizontal overflow or flagged text clipping"
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n## Candidate saved-career responsive rendering\n\n'+line+'\n')
          PY
