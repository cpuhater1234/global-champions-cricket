name: GCC v7.4 Dynasty Longevity QA

on:
  push:
    branches:
      - work/v7.4-dynasty-balance
  workflow_dispatch:

jobs:
  longevity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild frozen v7.3.4 product
        run: python qa/rebuild_v734.py

      - name: Verify frozen v7.3.4 product
        run: python qa/check_v734.py

      - name: Check longevity harness syntax
        run: node --check qa/browser_v740_longevity.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run 2008-2014 longevity audit
        run: node --experimental-websocket qa/browser_v740_longevity.mjs

      - name: Upload longevity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v740-longevity-qa
          path: |
            qa/output/v740-longevity/
            game/global_champions_cricket_v7_3_4_golden_dynasty.html
          if-no-files-found: warn
