name: GCC v7.2.6 Preseason Journey QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  preseason-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.6 candidate
        run: python qa/rebuild_v726.py

      - name: Verify v7.2.6 save continuity
        run: python qa/check_v726_save.py

      - name: Check journey harness syntax
        run: node --check qa/browser_v726_preseason_journey.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run full v7.2.6 preseason journey
        run: node --experimental-websocket qa/browser_v726_preseason_journey.mjs

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v726-preseason-journey
          path: |
            qa/output/v726-preseason-journey/
            game/global_champions_cricket_v7_2_6_foundation_save_continuity.html
          if-no-files-found: warn
