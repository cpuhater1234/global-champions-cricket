name: Publish verified v117 consolidation build
on:
  push:
    branches: [work/v117-consolidation]
    paths: ['.github/workflows/v117-publish-consolidation.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and verify against the Chromium-tested candidate
        run: |
          mkdir -p qa/results
          node qa/scratch_build_final.mjs
          cp qa/candidates/v116-authenticity-candidate.html PLAY_v117.html
          hash=9890a9108aa260b5a263fa407ac3bb371d23de59f05064f78e55036847003cd9
          printf '%s  %s\n' "$hash" PLAY_v117.html "$hash" qa/candidates/v116-authenticity-candidate.html | sha256sum -c
          test "$(tr 'A-F' 'a-f' < qa/candidates/CANDIDATE_SHA256.txt)" = "$hash"
      - name: Commit generated files to the consolidation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAY_v117.html qa/candidates/v116-authenticity-candidate.html qa/candidates/CANDIDATE_SHA256.txt
          git commit -m 'Publish verified narrow-screen v117 playable build'
          git push origin HEAD:refs/heads/work/v117-consolidation
