name: v117 narrow layout and keyboard QA
on:
  push:
    branches: [work/v117-narrow-qa]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCC8_TEST_BUILD: PLAY_v117.html
      GCC8_TEST_REPORT_DIR: qa/results/whole-ui-career
      GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
      GCC8_NARROW_DIR: qa/results/v117-narrow
      GCC8_EXPECT_SHA256: 0fab41962a487ac91862be64969cf67aa04a6924efdc4ef73c79b0c385c86bc0
      GCC8_TEST_LAST_YEAR: '2009'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and generate disposable career
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          python - <<'PY'
          from pathlib import Path
          runner = Path('qa/structural-risk/career-run.mjs')
          setup = runner.read_text().split('// Double submission must not consume another match.', 1)[0]
          Path('qa/structural-risk/v117-fixture.mjs').write_text(
              setup + """fs.writeFileSync(reportDir+'/checkpoint-2009.json',context.GCC8_ENGINE_READ.backupRaw());\n"""
          )
          audit = Path('qa/v116_narrow_focus_layout.cjs')
          audit.write_text(audit.read_text().replace("await prepareXI();await call('lodge');", "await call('continue');").replace('ow+Math.max(0,oo)', 'Math.max(0,ow+oo)'))
          PY
          node qa/structural-risk/v117-fixture.mjs > /tmp/v117-career.log || { tail -c 2500 /tmp/v117-career.log; exit 1; }
          test -f qa/results/whole-ui-career/checkpoint-2009.json
      - name: Measure mobile layout and keyboard focus
        run: |
          python - <<'PY'
          from pathlib import Path
          build = Path('PLAY_v117.html').read_bytes()
          position = build.rfind(b'</head>')
          assert position > 0
          css = b"""<style>
          @media (max-width:390px){
            #g8app#g8app #g8stage .gccuiCampaignRibbon>div{grid-template-rows:auto minmax(44px,auto) auto;padding:10px 12px}
            #g8app#g8app #g8stage .gccuiCampaignRibbon>div>span{letter-spacing:.08em}
            #g8app#g8app#g8app #g8hud .g8careernav .g8navitem{padding-inline:.3rem!important;font-size:.8rem!important;letter-spacing:.03em}
            #g8app#g8app#g8app .g8careernav .g8navitem:focus-visible{outline-offset:-4px!important}
          }
          </style>"""
          Path('qa/results/v117-narrow-trial.html').write_bytes(build[:position] + css + build[position:])
          PY
          GCC8_TEST_BUILD=qa/results/v117-narrow-trial.html GCC8_EXPECT_SHA256= node qa/v116_narrow_focus_layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v117-narrow-layout-and-focus
          path: qa/results/v117-narrow
