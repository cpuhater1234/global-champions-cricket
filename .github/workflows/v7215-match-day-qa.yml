name: GCC v7.2.15 Match-Day Conditions QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  conditions-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.15 candidate
        run: python qa/rebuild_v7215.py

      - name: Inspect candidate structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          src=Path('game/global_champions_cricket_v7_2_14_year_shell_continuity.html')
          dst=Path('game/global_champions_cricket_v7_2_15_match_day_conditions.html')
          print('SOURCE',hashlib.sha256(src.read_bytes()).hexdigest())
          print('TARGET',hashlib.sha256(dst.read_bytes()).hexdigest())
          a=src.read_text('utf-8'); b=dst.read_text('utf-8')
          sa=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',a,re.S|re.I)
          sb=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',b,re.S|re.I)
          print('SCRIPT_BLOCKS',len(sa),len(sb))
          print('CHANGED_SCRIPT_BLOCKS',[i for i,(x,y) in enumerate(zip(sa,sb)) if x!=y])
          for line in b.splitlines():
              low=line.lower()
              if any(k in low for k in ['weather','match-day','match day','conditions','next fixture','next match','overcast','cool / damp','hot / dry','settled']):
                  print('MATCH_DAY_LINE',line[:900])
          PY

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          text=Path('game/global_champions_cricket_v7_2_15_match_day_conditions.html').read_text('utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          assert len(scripts)==9, len(scripts)
          with tempfile.TemporaryDirectory() as td:
              for i,s in enumerate(scripts):
                  p=Path(td)/f's{i}.js'
                  p.write_text(s,'utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          print('JS_SYNTAX_OK',len(scripts))
          PY

      - name: Upload reconstructed candidate
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v7215-match-day-candidate
          path: game/global_champions_cricket_v7_2_15_match_day_conditions.html
          if-no-files-found: error
