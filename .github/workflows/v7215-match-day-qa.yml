name: GCC v7.2.15 Match-Day Conditions QA

on:
  push:
    branches:
      - work/v7.2-structural-rebuild
  workflow_dispatch:

jobs:
  conditions-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact v7.2.15 candidate
        run: python qa/rebuild_v7215.py

      - name: Run match-day conditions guardrail
        run: python qa/check_v7215_conditions.py

      - name: Check browser harness syntax
        run: |
          node --check qa/browser_v7215_conditions.mjs
          node --check qa/browser_v7215_stats.mjs

      - name: Locate Chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version

      - name: Run match-day conditions browser regression
        run: node --experimental-websocket qa/browser_v7215_conditions.mjs

      - name: Run paired v7.2.14 vs v7.2.15 statistical regression
        run: node --experimental-websocket qa/browser_v7215_stats.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-v7215-match-day-qa
          path: |
            qa/output/v7215-conditions-audit/
            game/global_champions_cricket_v7_2_15_match_day_conditions.html
          if-no-files-found: warn
