name: GCC whole interface and copy audit
on:
  push:
    branches: [work/v116-candidate-acceptance]
    paths: ['qa/v116_interface_audit.cjs', 'qa/v116_surface_audit_helpers.cjs', '.github/workflows/v116-interface-audit.yml']
permissions:
  contents: write
env:
  # Exact six-background match-surface candidate.
  CANDIDATE_SHA256: af1e36b9c6b43fb914823e5949fa53d4ad22c82fec69f350b56472940a5ab322
concurrency:
  group: gcc-interface-audit
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native browser
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock playwright
      - name: Build exact review candidate
        run: |
          python qa/v116_canonical_source.py build --source v116/canonical --allow-runtime-changes --output qa/results/interface-audit.html
          sha256sum qa/results/interface-audit.html
      - uses: actions/cache/restore@v4
        with:
          path: qa/results/whole-ui-career
          key: gcc-ui-career-79a2fbfe-seed101-v1-${{ hashFiles('qa/structural-risk/career-run.mjs', 'qa/offline_game_host.mjs') }}
      - name: Require existing checkpoints
        run: |
          test -f qa/results/whole-ui-career/checkpoint-2009.json
          test -f qa/results/whole-ui-career/checkpoint-2019.json
          test -f qa/results/whole-ui-career/checkpoint-2025.json
          test -f qa/results/whole-ui-career/checkpoint-2026.json
      - name: Check UI controls and empty analysis against reference
        env:
          GCC8_BASE_BUILD: qa/results/interface-before.html
          GCC8_TEST_BUILD: qa/results/interface-audit.html
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
        run: |
          mkdir -p /tmp/interface-before
          git archive ebf0ee3119c40b3d8f07c38a8ebf978622c8062b v116/canonical | tar -x -C /tmp/interface-before
          python qa/v116_canonical_source.py build --source /tmp/interface-before/v116/canonical --output qa/results/interface-before.html
          node qa/v116_secondary_markup_check.mjs
          node qa/v116_secondary_analysis_check.mjs
      - name: Audit main screens, secondary panels and terminology
        env:
          GCC8_TEST_BUILD: qa/results/interface-audit.html
          GCC8_WHOLE_UI_DIR: qa/results/interface-audit
          GCC8_REQUIRE_OWNER_FIX: '1'
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" node qa/v116_interface_audit.cjs
      - name: Preserve diagnostic evidence
        if: always()
        run: |
          python - <<'SAVE'
          from pathlib import Path
          from PIL import Image
          import shutil
          src=Path('qa/results/interface-audit');dst=Path('docs/release/interface-audit/${{ github.run_id }}');dst.mkdir(parents=True,exist_ok=True)
          for f in src.glob('*.json'):
              folder=dst if f.name=='manifest.json' else dst/(f.name[:4] if f.name[:4].isdigit() else 'foundation');folder.mkdir(parents=True,exist_ok=True);shutil.copyfile(f,folder/f.name)
          for f in src.glob('*.png'):
              folder=dst/(f.name[:4] if f.name[:4].isdigit() else 'foundation');folder.mkdir(parents=True,exist_ok=True);Image.open(f).convert('RGB').save(folder/f.with_suffix('.jpg').name,quality=88,optimize=True)
          SAVE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/release/interface-audit
          if ! git diff --cached --quiet; then
            git commit -m 'Record native match UI flow evidence'
            git pull --rebase origin work/v116-candidate-acceptance
            git push origin HEAD:refs/heads/work/v116-candidate-acceptance
          fi
