name: GCC v116 exact source identity audit

on:
  push:
    branches: [v116]
    paths:
      - 'GCC_v116_release (1).html'
      - 'qa/v116_source_reconciliation.py'
      - '.github/workflows/v116-source-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-identity:
    name: Frozen binary and lossless source extraction
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact frozen release identity and source inventory
        run: python qa/v116_source_reconciliation.py audit --json qa/results/v116-source-audit.json
      - name: Lossless extraction and exact binary round trip
        run: python qa/v116_source_reconciliation.py roundtrip --json qa/results/v116-source-roundtrip.json
      - name: Assert provenance and record limitations
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          audit=json.loads(Path('qa/results/v116-source-audit.json').read_text())
          roundtrip=json.loads(Path('qa/results/v116-source-roundtrip.json').read_text())
          assert audit['release_sha256']=='b27cf0b4c7e6e4e7a78eaa5c80154dfd0f70657ce9f774dd405505e97e82c6d0'
          assert audit['recorded_git_blob']=='088cf689ef3a464b06e8512627811ad60864b3e8'
          assert audit['styles']==17 and audit['scripts']==20
          assert roundtrip['roundtrip']['byte_identical_to_release']
          assert audit['source']['maintained_source_reproduction']=='NOT VERIFIED'
          msg='PASS: exact frozen v116 binary and lossless extraction round trip. Maintained v8/build.py parity: NOT VERIFIED.'
          print(msg)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## GCC v116 source provenance\n\n'+msg+'\n')
          PY
