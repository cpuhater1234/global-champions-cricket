name: GCC archive density review
on:
  push:
    branches: [work/v116-candidate-acceptance]
    paths: ['qa/v116_archive_density.cjs', '.github/workflows/v116-archive-density.yml']
permissions:
  contents: write
env:
  # Edited, unpromoted accessibility candidate built from v116/canonical (CSS-only change to styles/31). Not the recorded manifest snapshot.
  CANDIDATE_SHA256: ae4b362bbd67d4d5c4ad4fea18c831508bfffddc516dc29c8801c89529ba05f1
concurrency:
  group: gcc-archive-density
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native browser
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock playwright
      - name: Build pinned before and after candidates
        run: |
          mkdir -p /tmp/archive-before
          git archive 18208dab4c3e416e77ce624f7d3b07f362873b35 v116/canonical | tar -x -C /tmp/archive-before
          python qa/v116_canonical_source.py build --source /tmp/archive-before/v116/canonical --output qa/results/archive-before.html
          python qa/v116_canonical_source.py build --source v116/canonical --output qa/results/archive-after.html
          python - <<'CHECK'
          from pathlib import Path
          from hashlib import sha256
          from qa.v116_source_reconciliation import BLOCK
          a=Path('qa/results/archive-before.html').read_bytes();b=Path('qa/results/archive-after.html').read_bytes()
          assert sha256(a).hexdigest()=='c8990d219359ce23f697db136d47e44673427167cec0bae83638e61ceb5909a0'
          assert sha256(b).hexdigest()=='ae4b362bbd67d4d5c4ad4fea18c831508bfffddc516dc29c8801c89529ba05f1'
          aa=list(BLOCK.finditer(a));bb=list(BLOCK.finditer(b))
          assert [m[3] for m in aa if m[1]==b'script']==[m[3] for m in bb if m[1]==b'script']
          changed=[i for i,(x,y) in enumerate(zip(aa,bb)) if x[3]!=y[3]];assert changed==[10],changed
          print('Only existing archive CSS owner changed;22 runtime bodies unchanged')
          CHECK
      - uses: actions/cache/restore@v4
        with:
          path: qa/results/whole-ui-career
          key: gcc-ui-career-79a2fbfe-seed101-v1-${{ hashFiles('qa/structural-risk/career-run.mjs', 'qa/offline_game_host.mjs') }}
      - name: Require existing checkpoints without rerunning career acceptance
        run: |
          test -f qa/results/whole-ui-career/checkpoint-2009.json
          test -f qa/results/whole-ui-career/checkpoint-2019.json
      - name: Paired archive and adjacent layout checks
        id: audit
        continue-on-error: true
        env:
          GCC8_BASE_BUILD: qa/results/archive-before.html
          GCC8_TEST_BUILD: qa/results/archive-after.html
          GCC8_ARCHIVE_DIR: qa/results/archive-density
          GCC8_BROWSER_CAREER_DIR: qa/results/whole-ui-career
        run: |
          GCC8_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" node qa/v116_archive_density.cjs
      - name: Preserve bounded review evidence
        if: always()
        run: |
          python - <<'SAVE'
          from pathlib import Path
          from PIL import Image
          import shutil
          src=Path('qa/results/archive-density');dst=Path('docs/release/archive-density/${{ github.run_id }}');dst.mkdir(parents=True,exist_ok=True)
          for f in src.glob('*.json'):shutil.copyfile(f,dst/f.name)
          for f in src.glob('*.png'):
              im=Image.open(f).convert('RGB');im.save(dst/f.with_suffix('.jpg').name,quality=88,optimize=True)
          SAVE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/release/archive-density
          if ! git diff --cached --quiet; then
            git commit -m 'Record paired archive density review evidence'
            git pull --rebase origin work/v116-candidate-acceptance
            git push origin HEAD:refs/heads/work/v116-candidate-acceptance
          fi
      - name: Require focused checks
        if: always()
        env:
          AUDIT: ${{ steps.audit.outcome }}
        run: test "$AUDIT" = success
